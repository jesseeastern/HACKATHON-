<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyCNX</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%2322305C%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22%23E0B25A%22 font-family=%22sans-serif%22 font-weight=%22700%22%3EM%3C/text%3E%3C/svg%3E">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{
  --stage:#E4DED3; --app:#FBFAF7; --surface:#FFFFFF; --ink:#221A14; --muted:#6E6258; --line:#E7E0D5;
  --gold:#B8862B; --ring:#D9A441; --brand:#22305C; --on-brand:#FFFFFF; --red:#A3322A; --soft:#F2EDE4; --good:#2F6F57; --star:#C8901E;
  --map-land:#EEE8DC; --map-water:#B9CFD6; --map-road:#FFFFFF; --map-green:#D9E3CC;
  --display:"Mitr",ui-sans-serif,system-ui,sans-serif; --body:"Sarabun",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#070605; --app:#15110D; --surface:#201A15; --ink:#F1EBE3; --muted:#B3A89B; --line:#342C24;
  --gold:#E0B25A; --ring:#E0B25A; --brand:#AEBBEE; --on-brand:#15110D; --red:#E0766C; --soft:#2A231C; --good:#7CC7A6; --star:#E8B04A;
  --map-land:#221C16; --map-water:#243A44; --map-road:#3A3129; --map-green:#26301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#070605; --app:#15110D; --surface:#201A15; --ink:#F1EBE3; --muted:#B3A89B; --line:#342C24;
  --gold:#E0B25A; --ring:#E0B25A; --brand:#AEBBEE; --on-brand:#15110D; --red:#E0766C; --soft:#2A231C; --good:#7CC7A6; --star:#E8B04A;
  --map-land:#221C16; --map-water:#243A44; --map-road:#3A3129; --map-green:#26301F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--stage);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.2;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* phone frame: the whole product lives inside it */
.stage{min-height:100vh;display:grid;place-items:center;padding-block:20px;padding-inline:16px}
.phone{position:relative;width:390px;max-width:100%;height:min(844px,max(660px,calc(100vh - 40px)));background:var(--app);border:10px solid #111;border-radius:46px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgb(0 0 0/.35)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-inline:16px;padding-block:0 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@media (max-width:520px){.stage{padding:0;display:block;min-height:0}.phone{width:100%;height:100vh;height:100dvh;min-height:560px;border:0;border-radius:0;box-shadow:none}}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 8px;position:sticky;top:0;z-index:5;background:var(--app);margin-inline:-16px;padding-inline:16px}
.logo{font-family:var(--display);font-weight:600;font-size:21px}
.logo span{color:var(--gold)}
.tools{display:flex;gap:6px}
.chipbtn{background:var(--soft);border:0;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;min-width:36px}
.tung{height:6px;flex:none;background:linear-gradient(135deg,var(--gold) 25%,transparent 25%) 0 0/14px 6px,linear-gradient(225deg,var(--gold) 25%,transparent 25%) 0 0/14px 6px;opacity:.5}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px;box-shadow:0 2px 10px rgb(0 0 0/.06);margin-top:4px}
.search input{border:0;background:none;padding:0;flex:1;font:inherit;color:var(--ink);outline:none}
.cats{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:4px 8px 6px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;min-width:62px}
.cats button span{font-size:20px}
.cats button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.sec{margin-top:22px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.sec-h h2{font-size:18px}
.sec-h small{color:var(--muted);font-size:13px}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;padding-bottom:4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row>*{scroll-snap-align:start;flex:none}

/* ringed avatar */
.ring{border-radius:50%;padding:3px;background:conic-gradient(var(--ring),#F3D48A,var(--ring));display:inline-block;flex:none}
.ring img{display:block;border-radius:50%;object-fit:cover;border:2px solid var(--app);width:100%;height:100%}

/* featured card */
.feat{width:300px;display:block}
.feat .im{position:relative}
.feat .im>img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;display:block}
.badge{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;box-shadow:0 1px 4px rgb(0 0 0/.2)}
.feat .ring{position:absolute;left:12px;bottom:-30px;width:72px;height:72px}
.feat .tx{padding:36px 2px 0}
.t1{font-weight:700;line-height:1.3}
.t2{color:var(--muted);font-size:14px;line-height:1.35}
.star{color:var(--star)}
/* small tile */
.tile{width:150px;display:block}
.tile .im{position:relative}
.tile .im>img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;display:block}
.tile .ring{position:absolute;left:8px;bottom:-18px;width:46px;height:46px}
.tile .tx{padding:22px 1px 0;font-size:14px}
.tile .t1{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}
.grid2 .tile{width:auto}
.locals .loc{width:78px;text-align:center;font-size:13px;font-weight:600}
.locals .ring{width:72px;height:72px;margin-bottom:4px}

/* bottom bars live inside the phone */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--app);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;color:var(--muted);font-size:11px;font-weight:700}
.tabbar a[aria-current="page"]{color:var(--brand)}
.tabbar svg{width:22px;height:22px}
.bookbar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--app);border-top:1px solid var(--line)}
.bookbar b{font-size:17px}
.btn{background:var(--brand);color:var(--on-brand);border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;display:inline-block;text-align:center}
.btn.gold{background:var(--gold);color:#fff}
.btn.wide{width:100%;display:block}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:700;text-align:center;display:inline-block}

/* map */
.mapwrap{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--map-land)}
.mapwrap svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.mini{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:10px}
.mini>img{width:70px;height:70px;border-radius:12px;object-fit:cover}
.note{font-size:12px;color:var(--muted)}

/* experience page */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0;font-weight:700;color:var(--muted)}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px -16px 0;padding-inline:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{flex:0 0 82%;height:190px;object-fit:cover;border-radius:14px;scroll-snap-align:start}
.x-title{font-size:23px;margin:14px 0 4px}
.meta{color:var(--muted);font-size:14px}
.hostrow{display:flex;gap:12px;align-items:center;margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:16px}
.hostrow .ring{width:64px;height:64px}
.hostrow b{font-family:var(--display);font-weight:500;font-size:17px;display:block}
.hostrow div>span{color:var(--muted);font-size:13px;display:block}
.hostrow .go{margin-left:auto;color:var(--muted);font-size:20px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.facts div{background:var(--soft);border-radius:12px;padding:8px;text-align:center}
.facts b{display:block;font-size:15px}
.facts span{font-size:11px;color:var(--muted)}
.group{margin-top:12px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.faces{display:flex}
.faces button{width:34px;height:34px;border-radius:50%;border:2px solid var(--app);margin-left:-8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;padding:0}
.faces button:first-child{margin-left:0}
.faces .open{background:var(--soft);color:var(--muted);border-style:dashed;border-color:var(--line)}
.group p{margin:0;font-size:13px;line-height:1.35}
.blk{margin-top:24px}
.blk h2{font-size:18px;margin-bottom:10px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 16px 28px}
.tl li::before{content:"";position:absolute;left:0;top:5px;width:16px;height:16px;border-radius:50%;background:var(--app);border:3px solid var(--gold)}
.tl .ph{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.tl .tm{font-variant-numeric:tabular-nums;font-weight:700;margin-left:6px;color:var(--muted);font-size:12px}
.tl p{margin:2px 0 0}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{display:flex;gap:10px;align-items:flex-start}
.list li span:first-child{flex:none;width:22px;text-align:center}
.rate{display:flex;align-items:center;gap:10px}
.rate .big{font-family:var(--display);font-size:34px;font-weight:600}
.dims{display:grid;gap:6px;margin-top:10px}
.dim{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:13px}
.bar{height:5px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.rev{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.rev .who{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.rev .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.rev p{margin:0;font-size:14px}
.tag-sample{font-size:11px;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:1px 8px}

/* sheets inside the phone */
.scrim{position:absolute;inset:0;background:rgb(0 0 0/.4);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--app);width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;gap:12px;max-height:88%;overflow:auto}
.sheet h3{font-size:19px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.date{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:14px}
.date[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.date small{display:block;color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:space-between}
.stepper div{display:flex;align-items:center;gap:14px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
label{font-size:12px;font-weight:700;color:var(--muted)}
.field{display:grid;gap:4px}
.ok{background:var(--soft);border-radius:14px;padding:14px;display:grid;gap:10px}
.ok.err{color:var(--red)}

/* host profile */
.hp-head{text-align:center;margin-top:10px}
.hp-head .ring{width:112px;height:112px}
.hp-head h1{font-size:26px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;text-align:center}
.stats div{border:1px solid var(--line);border-radius:12px;padding:8px}
.stats b{display:block;font-family:var(--display);font-size:18px}
.stats span{font-size:11px;color:var(--muted)}
.socials{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.socials span{background:var(--soft);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.quote{font-size:16px;border-left:3px solid var(--gold);padding-left:12px;margin:0}

/* chat */
.chat{display:grid;gap:8px;margin-top:12px}
.msg{max-width:82%;padding:8px 12px;border-radius:16px;background:var(--soft);font-size:14px}
.msg small{display:block;font-weight:700;font-size:11px;color:var(--muted)}
.msg.me{justify-self:end;background:var(--brand);color:var(--on-brand)}
.msg.me small{color:inherit;opacity:.8}
.compose{flex:none;display:flex;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);border-top:1px solid var(--line);background:var(--app)}
.trip{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:10px}
.trip>img{width:72px;height:72px;border-radius:12px;object-fit:cover}

/* earn */
.e-hero{position:relative;border-radius:20px;overflow:hidden;margin-top:6px}
.e-hero img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.e-hero .cap{position:absolute;inset:auto 0 0 0;padding:14px;background:linear-gradient(transparent,rgb(10 8 6/.85));color:#fff;font-size:14px}
.e-hero .cap b{font-family:var(--display);font-weight:500;font-size:16px;display:block}
.h-big{font-size:25px;margin:16px 0 4px}
.money{font-family:var(--display);font-weight:600;font-size:44px;line-height:1;color:var(--good);font-variant-numeric:tabular-nums;margin-top:12px}
.money-sub{color:var(--muted);font-size:13px;margin-top:2px}
.rng{display:grid;gap:2px;margin-top:10px}
.rng div{display:flex;justify-content:space-between;font-size:14px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--gold)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twocol>div{border-radius:14px;padding:12px;background:var(--soft)}
.twocol h3{font-size:14px;margin-bottom:6px}
.twocol ul{margin:0;padding-left:16px;font-size:13px;display:grid;gap:3px}
.story{width:250px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.story img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.story .b{padding:12px;display:grid;gap:6px;font-size:13px}
.story .earned{font-family:var(--display);color:var(--good);font-size:18px}
.want{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.want small{display:block;color:var(--muted)}
.want .btn{padding:8px 12px;font-size:13px;flex:none}
.steps4{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps4 li{counter-increment:s;display:flex;gap:10px;align-items:center}
.steps4 li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.support{display:flex;gap:12px;align-items:center;border-radius:16px;background:var(--soft);padding:12px}
.support .av{width:52px;height:52px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--display);font-size:22px;flex:none}
.progress{height:4px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--gold)}
.ob{display:grid;gap:14px;margin-top:14px}
.ob h1{font-size:23px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:14px}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--app);border-color:var(--ink)}
.live{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good);font-weight:700;border-radius:999px;padding:3px 10px;font-size:13px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.foot{margin-top:28px;font-size:11px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="stage"><div class="phone" id="phone"></div></div>

// Upcoming dates: weekly series from the live calendar (rolled forward week by week), or a host's own schedule.
const WEEK = 7*86400e3;
function upcoming(x){
  const from = Date.now() - 2*3600e3, to = Date.now() + 21*86400e3, out = [], seen = new Set();
  if (x.sched){
    for (let d = 0; d < 21; d++){
      const day = new Date(Date.now() + d*86400e3);
      const ymd = day.toLocaleDateString("en-CA",TZ), dow = new Date(ymd + "T12:00:00+07:00").getUTCDay();
      if (!x.sched.days.includes(dow)) continue;
      const iso = new Date(`${ymd}T${x.sched.time}:00+07:00`).toISOString();
      if (new Date(iso).getTime() > from) out.push({start:iso, title:tx(x.title)});
    }
    return out;
  }
  if (!EVENTS) return [];
  EVENTS.filter(e => x.match.test(e.title)).forEach(e => {
    let t0 = new Date(e.start).getTime(); while (t0 < from) t0 += WEEK;
    for (let t1 = t0; t1 < to; t1 += WEEK){ const k = e.title + t1; if (!seen.has(k)){ seen.add(k); out.push({...e, start:new Date(t1).toISOString()}); } }
  });
  return out.sort((a,b) => a.start.localeCompare(b.start));
}

/* ======================= render ======================= */
const sc = () => $("#scroll");
function render(keep){
  const y = sc()?.scrollTop || 0, f = document.activeElement?.id, r = route(); let body, bottom = "", overlay = "";
  const x = r.startsWith("x-") ? byId(r.slice(2)) : null;
  if (x){ body = vExp(x); bottom = bookbar(x); if (S.sheet === "book") overlay = sheetBook(x); }
  else if (r.startsWith("h-") && HOSTS[r.slice(2)]) body = vHost(r.slice(2));
  else if (r === "map") body = vMap();
  else if (r === "trips") body = vTrips();
  else if (/^trip-\d+$/.test(r)){ body = vTrip(+r.slice(5)); bottom = `<form class="compose" id="compose"><input id="chatIn" placeholder="${esc(t("chatPh"))}" autocomplete="off"><button class="btn" type="submit">${t("send")}</button></form>`; }
  else if (r === "earn") body = vEarn();
  else if (/^earn-[1-5]$/.test(r)) body = vOnboard(+r.slice(5));
  else body = vExplore();
  if (S.sheet && S.sheet.startsWith("guest:")) overlay = sheetGuest(S.sheet.slice(6));
  document.documentElement.lang = L();
  $("#phone").innerHTML = `<div class="tung" aria-hidden="true"></div><div class="scroll" id="scroll">${body}</div>${bottom || (x ? "" : tabbar())}${overlay}`;
  if (keep){ sc().scrollTop = y; if (f){ const el = document.getElementById(f); if (el){ el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); } } }
  if (/^trip-\d+$/.test(r) && !keep) sc().scrollTop = sc().scrollHeight;
}
let last = route();
addEventListener("hashchange", () => { const r = route(); if (r !== last){ if (isEarn(r) !== isEarn(last)) langPref = null; S.sheet = null; S.sent = null; if (r.startsWith("x-")) S.guests = 1; } render(false); if (!/^trip-/.test(r)) sc().scrollTop = 0; last = r; });

/* ======================= interactions ======================= */
document.addEventListener("click", async ev => {
  const el = ev.target;
  const actEl = el.closest("[data-act]"), act = actEl?.dataset.act;
  if (act === "close" && el.closest("[data-stop]") && !el.closest('button[data-act="close"]')) { /* inside the sheet */ }
  else if (act === "close"){ S.sheet = null; S.sent = null; render(true); return; }
  if (act === "lang"){ langPref = L() === "th" ? "en" : "th"; render(true); return; }
  if (act === "theme"){ const nx = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = nx; store.set("theme", nx); render(true); return; }
  if (act === "open"){ S.sheet = "book"; S.sent = null; render(true); return; }
  if (act === "ploy"){ const n = $("#ployNote"); if (n) n.hidden = false; return; }
  const gu = el.closest("[data-guest]"); if (gu){ S.sheet = "guest:" + gu.dataset.guest; render(true); return; }
  const d = el.closest("[data-date]"); if (d){ S.date = d.dataset.date; render(true); return; }
  const g = el.closest("[data-g]"); if (g){ const x = byId(route().slice(2)); S.guests = Math.min(x.cap - x.going.length, Math.max(1, S.guests + +g.dataset.g)); render(true); return; }
  if (act === "book"){
    const x = byId(route().slice(2)), h = HOSTS[x.host];
    try {
      if (db) await db.collection("requests").doc(crypto.randomUUID()).set({experience:x.id, host:x.host, date:S.date, guests:S.guests, name:S.name.trim(), total:x.price*S.guests, lang:L(), createdAt:new Date().toISOString()});
      S.trips.push({exp:x.id, date:S.date});
      S.sent = {msg: t("sent")(hn(h), fmtDay(S.date)) + (db ? "" : t("demo"))};
    } catch(e){ S.sent = {err:true, msg:t("fail")}; }
    render(true); return;
  }
  const c1 = el.closest("[data-cat]"); if (c1){ S.cat = c1.dataset.cat || null; render(true); return; }
  const c2 = el.closest("[data-mapCat],[data-mapcat]"); if (c2){ S.mapCat = c2.dataset.mapcat || null; S.mapSel = null; render(true); return; }
  const pin = el.closest("[data-pin]"); if (pin && route() === "map"){ S.mapSel = pin.dataset.pin; render(true); return; }
  const oc = el.closest("[data-ocat]"); if (oc){ S.ob.cat = oc.dataset.ocat; render(true); return; }
  const od = el.closest("[data-oday]"); if (od){ const i = +od.dataset.oday; S.ob.days = S.ob.days.includes(i) ? S.ob.days.filter(z => z !== i) : [...S.ob.days, i]; render(true); return; }
  const w = el.closest("[data-want]"); if (w){ S.ob = S.ob || obDefaults(); if (!S.ob.title) S.ob.title = tx(WANTED[+w.dataset.want].t); }
});
document.addEventListener("keydown", ev => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches?.("[data-pin]")){ ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); }
  if (ev.key === "Escape" && S.sheet){ S.sheet = null; render(true); }
});
document.addEventListener("input", ev => {
  const id = ev.target.id, v = ev.target.value;
  if (id === "q"){ S.q = v; render(true); return; }
  if (id === "gname"){ S.name = v; return; }
  if (id === "cG" || id === "cP"){ S[id === "cG" ? "calcG" : "calcP"] = +v; render(true); return; }
  if (id === "oPrice" || id === "oCap"){ S.ob[id === "oPrice" ? "price" : "cap"] = +v; render(true); return; }
  const map = {oName:"name", oPhone:"phone", oSocial:"social", oTitle:"title", oEvent:"event", oTime:"time"};
  if (S.ob && map[id]) S.ob[map[id]] = v;
});
document.addEventListener("submit", async ev => {
  ev.preventDefault();
  if (ev.target.id === "compose"){
    const i = +route().slice(5), inp = $("#chatIn"), m = inp.value.trim(); if (!m) return;
    seedChat(i).push(["me", m]); render(false); sc().scrollTop = sc().scrollHeight; $("#chatIn")?.focus(); return;
  }
  const f = ev.target.closest("form[data-step]"); if (!f) return;
  const n = +f.dataset.step;
  if (n < 4){ location.hash = "earn-" + (n + 1); return; }
  try {
    const o = S.ob;
    if (db) await db.collection("applications").doc(crypto.randomUUID()).set({name:o.name.trim(), phone:o.phone.trim(), social:o.social.trim(), category:o.cat, title:o.title.trim(), event:o.event.trim(), price:o.price, cap:o.cap, days:o.days, time:o.time, lang:L(), createdAt:new Date().toISOString()});
    S.obErr = false; location.hash = "earn-5";
  } catch(e){ S.obErr = true; render(true); }
});

render(false);
(async () => {
  db = window.claude ? await window.claude.use("db") : null;
  if (!db){ try { const d = await (await fetch("data/feed.json")).json(); EVENTS = d.events || []; } catch(e){ EVENTS = []; } render(true); return; }
  db.doc("feed/cm-events").onSnapshot(snap => { const d = snap.exists ? snap.data() : null; EVENTS = d && Array.isArray(d.events) ? d.events : []; render(true); }, () => {});
})();
})();
</script>
